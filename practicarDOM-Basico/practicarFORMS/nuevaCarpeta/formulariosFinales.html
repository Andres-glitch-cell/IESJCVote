<body>
    <!-- <button id="miboton" type="button">clica aqui</button> -->
    <form id="miFormulario">
        <h2>Tamaño de Pizza</h2>
        <select id="opcionesTamañoPizza">
            <option>Elige una opción</option>
            <option value="5">Pequeña</option>
            <option value="10">Mediana</option>
            <option value="15">Grande</option>
        </select>
        <br><br>
        <!-- ? Añadir un innerHTML para mostrar los extras -->
        <label>
            Extras <input type="checkbox" id="extrasCheckbox"><br><br>
            <div id="contenedorExtras"></div>
        </label>
        <label>
            Efectivo<input type="radio" id="pagarEfectivo" name="metodoPago">
        </label>
        <label>
            Tarjeta <input type="radio" id="pagarTarjeta" name="metodoPago">
            <div id="añadirContenidoAlDiv"></div>
        </label>
        <br>
        <button type="submit">Enviar Formulario</button>
    </form>
    <script>
        let totalAPagar = 0

        let elementoFormulario = document.getElementById("miFormulario")

        // [IMPORTANT]: CHECKBOX (EXTRAS)
        let elementoCheckboxExtra = document.getElementById("extrasCheckbox")
        let elementoContenedorExtras = document.getElementById("contenedorExtras")
        let elementosExtras = document.createElement("div")
        let contenidoExtras = `
            <label> Extra de Salsa de Tomate <input type="radio" id="extraSalsaTomate" name="grupoExtras"></label><br>
            <label> Extra de Champiñones<input type="radio" id="extraChampiñones" name="grupoExtras"></label><br>
            <label>Donar<input type="radio" id="donativo" name="grupoExtras"></label> <br><br>
        `
        elementosExtras.innerHTML = contenidoExtras

        elementoCheckboxExtra.addEventListener("change", () => {
            if (elementoCheckboxExtra.checked) {
                elementoContenedorExtras.appendChild(elementosExtras);
            } else {
                elementosExtras.remove();
            }
        });

        // [IMPORTANT]: RADIOBUTTONS (MÉTODO DE PAGO)
        let elementoTargeta = document.getElementById("pagarTarjeta")
        let elementoEfectivo = document.getElementById("pagarEfectivo")

        let añadirInputTargetaAlDiv = document.getElementById("añadirContenidoAlDiv")
        let nodoDiv = document.createElement("div")
        let contenidoNodoDiv = `<br><label>Introduce tu tarjeta: <input type="text" id="tarjetaNumero"></label>`;
        nodoDiv.innerHTML = contenidoNodoDiv
        elementoTargeta.addEventListener("change", () => {
            if (elementoTargeta.checked) {
                añadirInputTargetaAlDiv.appendChild(nodoDiv)
            }
        })

        elementoEfectivo.addEventListener("change", function () {
            if (elementoEfectivo.checked) {
                nodoDiv.remove();
            }
        });


        elementoFormulario.addEventListener("submit", (e) => {
            e.preventDefault()
            let elementoBotonSubmit = document.getElementsByTagName("button")[0]
            elementoBotonSubmit.disabled = true
            // [IMPORTANT]: SELECT (TIPO DE PIZZA)
            let elementoSelect = document.getElementById("opcionesTamañoPizza")
            if (elementoSelect) {
                let elementoMostrarTamañoPizza = document.createElement("p")
                // IMPORTANT Sacar el texto PLANO
                let textoPlanoOpciones = elementoSelect.options[elementoSelect.selectedIndex].text
                if (textoPlanoOpciones === "Elige una opción") {
                    alert("Esta opción no es apropiada")
                    return
                }
                // IMPORTANT Sacar el VALUE
                let opcionElegidaValue = elementoSelect.options[elementoSelect.selectedIndex].value
                let contenidoMostrarTamañoPizza = elementoMostrarTamañoPizza.innerHTML = `<p> Ha elegido el tamaño de pizza: ${textoPlanoOpciones} con un valor de ${opcionElegidaValue} €`
                document.body.appendChild(elementoMostrarTamañoPizza)
            }

        })
        /*

        Radio: Forma de pago (Efectivo o Tarjeta).
        Validación: Que el usuario haya elegido al menos un extra y una forma de pago.
